<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Armas do Valorant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .weapon-card {
            transition: all 0.3s ease;
        }
        .weapon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .weapon-image {
            height: 200px;
            object-fit: contain;
        }
        .loading-spinner {
            border-top-color: #ff4655;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen text-white">
    <div class="container mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-red-500 mb-4">Armas do Valorant</h1>
            <p class="text-gray-300 max-w-2xl mx-auto">Explore o arsenal de armas disponíveis no Valorant. Clique no botão abaixo para carregar os dados das armas da API oficial do Valorant.</p>
        </header>

        <!-- Fetch Button -->
        <div class="flex justify-center mb-12">
            <button id="fetchBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-300 transform hover:scale-105 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                </svg>
                Carregar Armas
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden flex justify-center items-center py-12">
            <div class="loading-spinner h-12 w-12 border-4 border-gray-700 rounded-full"></div>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden bg-red-900 text-white p-4 rounded-lg max-w-2xl mx-auto text-center mb-8">
            Falha ao carregar dados das armas. Por favor, tente novamente mais tarde.
        </div>

        <!-- Weapons Grid -->
        <div id="weaponsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fetchBtn = document.getElementById('fetchBtn');
            const weaponsGrid = document.getElementById('weaponsGrid');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');

            fetchBtn.addEventListener('click', fetchWeapons);

            async function fetchWeapons() {
                // Show loading, hide error and clear grid
                loading.classList.remove('hidden');
                error.classList.add('hidden');
                weaponsGrid.innerHTML = '';
                fetchBtn.disabled = true;
                
                try {
                    const response = await fetch('https://valorant-api.com/v1/weapons');
                    if (!response.ok) {
                        throw new Error('API request failed');
                    }
                    const data = await response.json();
                    
                    if (data.status !== 200 || !data.data) {
                        throw new Error('Invalid data received');
                    }
                    
                    displayWeapons(data.data);
                } catch (err) {
                    console.error('Error fetching weapons:', err);
                    error.classList.remove('hidden');
                } finally {
                    loading.classList.add('hidden');
                    fetchBtn.disabled = false;
                }
            }

            function displayWeapons(weapons) {
                weapons.forEach(weapon => {
                    const weaponCard = document.createElement('div');
                    weaponCard.className = 'weapon-card bg-gray-800 rounded-xl overflow-hidden shadow-lg';
                    
                    weaponCard.innerHTML = `
                        <div class="p-4 bg-gray-700">
                            <img src="${weapon.displayIcon}" alt="${weapon.displayName}" class="weapon-image w-full mx-auto">
                        </div>
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-red-400 mb-2">${weapon.displayName}</h3>
                            <div class="flex justify-between mb-3">
                                <span class="text-sm bg-gray-700 px-3 py-1 rounded-full">${weapon.shopData ? weapon.shopData.category : 'Unknown'}</span>
                                <span class="text-sm bg-gray-700 px-3 py-1 rounded-full">$${weapon.shopData ? weapon.shopData.cost : '0'}</span>
                            </div>
                            <p class="text-gray-300 text-sm mb-4">${weapon.shopData ? weapon.shopData.categoryText : ''}</p>
                            
                            <div class="grid grid-cols-2 gap-2 mb-4">
                                <div class="text-center">
                                    <span class="block text-xs text-gray-400">Fire Rate</span>
                                    <span class="font-bold">${weapon.weaponStats ? weapon.weaponStats.fireRate : 'N/A'}</span>
                                </div>
                                <div class="text-center">
                                    <span class="block text-xs text-gray-400">Magazine</span>
                                    <span class="font-bold">${weapon.weaponStats ? weapon.weaponStats.magazineSize : 'N/A'}</span>
                                </div>
                            </div>
                            
                            <button class="w-full bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded transition duration-200 view-details" data-weapon-id="${weapon.uuid}">
                                Ver Detalhes
                            </button>
                        </div>
                    `;
                    
                    weaponsGrid.appendChild(weaponCard);
                });

                // Add event listeners to detail buttons
                document.querySelectorAll('.view-details').forEach(button => {
                    button.addEventListener('click', function() {
                        const weaponId = this.getAttribute('data-weapon-id');
                        alert(`ID da Arma: ${weaponId}\nNormalmente mostraria mais detalhes aqui!`);
                    });
                });
            }
        });
    </script>
</body>
</html>
